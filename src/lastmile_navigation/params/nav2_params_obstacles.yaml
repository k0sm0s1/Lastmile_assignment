# Obstacle-avoidance mode: identical to nav2_params.yaml except that both
# costmaps get an extra layer fed by the live lidar obstacle_mapper node.
# Selected by: ros2 launch lastmile_navigation bringup_nav2.launch.py obstacles:=true
# Nav2 parameters for the TurtleBot3 Waffle running against lastmile_map.yaml.
# This is a trimmed-down variant of the stock turtlebot3/nav2 Humble example
# params, kept close to defaults on purpose - the point of this assignment is
# the pipeline (scan -> map -> localization -> custom node), not novel Nav2
# tuning. Adjust robot_radius / footprint here if you swap TurtleBot3 models.

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 3.5
    laser_min_range: 0.3     # drop self-hits on the chassis/camera mount (~0.13 m)
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # Seeded at the Gazebo spawn point, which is the assignment's origin (0,0,0).
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0   # 20 Hz was routinely missed on this machine
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.22
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      # Walls come from the static map (the world is a fixed scan). The laser
      # obstacle_layer was removed: under WSL2 its tf2 MessageFilter deadlocked
      # the costmap's TF buffer at startup (footprint + TF frozen), after which
      # every goal failed to transform and Humble reported a false "Reached the goal".
      plugins: ["static_layer", "obstacle_map_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_map_layer:
        # Live lidar obstacles from lastmile_obstacles/obstacle_mapper, read as a
        # second static layer. use_maximum: true adds them on top of the walls
        # instead of overwriting the first layer.
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/obstacle_map"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        use_maximum: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      # static map + inflation only: the environment is a fixed scan, live
      # obstacles are handled by the local costmap's obstacle layer.
      plugins: ["static_layer", "obstacle_map_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          obstacle_min_range: 0.3   # ignore self-hits inside the footprint
          raytrace_min_range: 0.0
      obstacle_map_layer:
        # Live lidar obstacles from lastmile_obstacles/obstacle_mapper, read as a
        # second static layer. use_maximum: true adds them on top of the walls
        # instead of overwriting the first layer.
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/obstacle_map"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        use_maximum: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: "lastmile_map.yaml"

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false   # stay inside the scanned (observed) floor area

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    # Humble's default is 20 ms. With Gazebo + the scanned mesh loading the CPU,
    # the planner/controller often take longer than that to *acknowledge* a
    # goal, the BT counts it as a failure and runs a recovery - the stop-and-go
    # seen on the way down the corridor. 500 ms removes those false recoveries.
    default_server_timeout: 500
    bt_loop_duration: 20
    global_frame: map
    robot_base_frame: base_footprint

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
